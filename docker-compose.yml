services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: momaz
      POSTGRES_USER: momaz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-momaz123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momaz -d momaz"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: alisidik1996/momaz-pos:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://momaz:${POSTGRES_PASSWORD:-momaz123}@postgres:5432/momaz
      DATABASE_URL_UNPOOLED: postgresql://momaz:${POSTGRES_PASSWORD:-momaz123}@postgres:5432/momaz
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY wajib diisi minimal 32 byte acak (generate openssl rand -base64 48)}"
      PRODUCTION: ${PRODUCTION:-false}
    volumes:
      - uploads_data:/app/app/static/uploads
      - tenants_data:/app/app/tenants
    ports:
      - "8181:8181"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  tenants_data:

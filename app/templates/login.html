<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTP - Sistem POS Multi Tenant</title>
  <!-- Bootstrap 5 CDN & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/login.css">
</head>

<body class="auth-page bg-light d-flex align-items-center justify-content-center">

  <div class="card auth-card bg-white my-4">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <h3 class="fw-bold tracking-tight mb-1 auth-title">MTP</h3>
        <p class="text-muted small mb-0">Multi Tenant P.O.S</p>
      </div>

      <!-- Navigation Tabs: Login vs Register -->
      <ul class="nav nav-pills nav-justified auth-tabs mb-4" id="authTabs" role="tablist">
        <li class="nav-item">
          <button class="nav-link active fw-semibold" id="login-tab-btn" onclick="switchAuthTab('login')" type="button">
            Masuk
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link fw-semibold" id="register-tab-btn" onclick="switchAuthTab('register')" type="button">
            Daftar
          </button>
        </li>
      </ul>

      <div class="tab-content" id="authTabsContent">
        <!-- 1. TAB LOGIN -->
        <div class="tab-pane fade show active" id="tab-login" role="tabpanel">
          <form id="login-form" onsubmit="handleLoginSubmit(event)">
            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Username</label>
              <input type="text" id="login-username" class="form-control" placeholder="Username" required autofocus>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-semibold text-secondary">Password</label>
              <input type="password" id="login-password" class="form-control" placeholder="Password" required>
            </div>

            <button type="submit" id="btn-submit-login" class="btn btn-primary w-100 py-2 fw-semibold auth-submit">
              Masuk
            </button>

            <div class="text-center mt-4">
              <span class="text-muted small">Belum punya akun?</span>
              <button type="button" class="btn btn-link btn-sm p-0 fw-semibold text-decoration-none ms-1"
                onclick="switchAuthTab('register')">
                Daftar Baru
              </button>
            </div>
          </form>
        </div>

        <!-- 2. TAB REGISTER ADMIN -->
        <div class="tab-pane fade" id="tab-register" role="tabpanel">
          <form id="register-form" onsubmit="handleRegisterSubmit(event)">
            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Nama</label>
              <input type="text" id="reg-fullname" class="form-control" placeholder="Nama" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Username</label>
              <input type="text" id="reg-username" class="form-control" placeholder="Username" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Password</label>
              <input type="password" id="reg-password" class="form-control" placeholder="Password" required>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-semibold text-secondary">Confirm Password</label>
              <input type="password" id="reg-password-confirm" class="form-control" placeholder="Confirm Password"
                required>
            </div>

            <button type="submit" id="btn-submit-register" class="btn btn-success w-100 py-2 fw-semibold auth-submit">
              Buat Akun
            </button>

            <div class="text-center mt-4">
              <span class="text-muted small">Sudah memiliki akun?</span>
              <button type="button" class="btn btn-link btn-sm p-0 fw-bold text-decoration-none ms-1"
                onclick="switchAuthTab('login')">
                Masuk
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script>
    // Tab switching function (independent of Bootstrap JS)
    function switchAuthTab(targetTab) {
      const loginBtn = document.getElementById("login-tab-btn");
      const registerBtn = document.getElementById("register-tab-btn");
      const loginPane = document.getElementById("tab-login");
      const registerPane = document.getElementById("tab-register");

      if (targetTab === "register") {
        loginBtn.classList.remove("active");
        registerBtn.classList.add("active");
        loginPane.classList.remove("show", "active");
        registerPane.classList.add("show", "active");
        document.getElementById("reg-fullname").focus();
      } else {
        registerBtn.classList.remove("active");
        loginBtn.classList.add("active");
        registerPane.classList.remove("show", "active");
        loginPane.classList.add("show", "active");
        document.getElementById("login-username").focus();
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btn-submit-login");
      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value;

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Memverifikasi...`;

      try {
        const res = await api.post("/api/auth/login", { username, password });

        if (!res.has_tenant) {
          showToast("Login berhasil! Anda belum memiliki toko retail, mengalihkan ke Setup Toko...", "info");
          setTimeout(() => {
            window.location.href = "/setup";
          }, 600);
        } else {
          showToast("Login berhasil! Mengalihkan...", "success");
          setTimeout(() => {
            window.location.href = res.user.role === "cashier" ? "/pos" : "/backoffice/dashboard";
          }, 500);
        }
      } catch (err) {
        showToast(err.message, "error");
        btn.disabled = false;
        btn.innerHTML = `Masuk ke Sistem`;
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btn-submit-register");
      const fullname = document.getElementById("reg-fullname").value.trim();
      const username = document.getElementById("reg-username").value.trim();
      const password = document.getElementById("reg-password").value;
      const pwdConfirm = document.getElementById("reg-password-confirm").value;

      if (password.length < 5) {
        showToast("Kata sandi minimal 5 karakter!", "warning");
        return;
      }

      if (password !== pwdConfirm) {
        showToast("Konfirmasi kata sandi tidak cocok!", "error");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Mendaftarkan...`;

      try {
        const res = await api.post("/api/tenants/register-admin", {
          full_name: fullname,
          username: username,
          password: password
        });

        showToast("Pendaftaran admin berhasil! Mengalihkan ke Setup Toko...", "success");
        setTimeout(() => {
          window.location.replace("/setup");
        }, 300);
      } catch (err) {
        showToast(err.message, "error");
        btn.disabled = false;
        btn.innerHTML = `Buat Akun & Lanjut Setup Toko`;
      }
    }
  </script>
</body>

</html>
